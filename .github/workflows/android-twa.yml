# APK Android (Trusted Web Activity) construit par Bubblewrap depuis android/twa-manifest.json.
#
# Déclenchement : à la main (workflow_dispatch), ou par un push qui touche android/
# ou ce fichier. L'APK est publié comme artefact du run.
#
# Signature : posée seulement si les trois secrets ANDROID_KEYSTORE_B64 (keystore
# en base64), ANDROID_KEYSTORE_PASSWORD et ANDROID_KEY_PASSWORD existent. Sans eux
# l'artefact est un APK NON SIGNÉ, à signer hors CI avec la clé de release : la clé
# ne doit jamais changer (mises à jour + Digital Asset Links, cf. public/.well-known/assetlinks.json).
name: APK Android (TWA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Composants Android SDK attendus par Bubblewrap
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.1.0" "platforms;android-36" > /dev/null
          test -d "$ANDROID_HOME/build-tools/36.1.0"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Construire
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TWA_OUT_DIR: ${{ runner.temp }}/apk
        run: bash android/build-twa.sh

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 30
