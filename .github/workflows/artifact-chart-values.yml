name: Chart values on the installed archive
on:
  pull_request:
    branches: [codex/qualification-chart-0a097121]
    paths:
      - 'packages/core/bin/Dashboard.tsx'
      - 'scripts/verify-artifact-chart-values.py'
      - '.github/workflows/artifact-chart-values.yml'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, extract and identify the precise archive
        env:
          BASELINE: ${{ github.event.pull_request.base.sha }}
          CANDIDATE: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ matrix.revision }}
        run: |
          rev="$CANDIDATE"
          if [[ "$VARIANT" == baseline ]]; then rev="$BASELINE"; fi
          git worktree add --detach "$RUNNER_TEMP/source" "$rev"
          python "$RUNNER_TEMP/source/scripts/build-modules-bundle.py" --output "$RUNNER_TEMP/dist"
          zip=$(find "$RUNNER_TEMP/dist" -name 'blueprint-modules-v*.zip')
          sha256sum "$zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/application"
          test "$(cat BUILD-REVISION)" = "$rev"
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-artifact.mjs
      - name: Compare chart values in static and mounted HTML against the exact input
        env:
          VARIANT: ${{ matrix.revision }}
        run: |
          python -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --quiet 'playwright==1.56.0'
          args=()
          if [[ "$VARIANT" == baseline ]]; then args+=(--baseline); fi
          "$RUNNER_TEMP/qa/bin/python" scripts/verify-artifact-chart-values.py "$RUNNER_TEMP/unpacked/application" --chrome "$(command -v google-chrome)" "${args[@]}"
      - if: matrix.revision == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-chart-values-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dist/blueprint-modules-v*.zip
