# Convergence gate — runs `npm run gate` on every PR targeting master.
# The gate (scripts/gate.cjs) is self-contained: it installs the packages/core
# deps and minimal React types itself (with --ignore-scripts to skip the root
# prisma postinstall), then chains tsc → vite build → doc-sync → vitest.
# A red gate (exit 1) fails the check and blocks the PR.

name: Convergence gate

on:
  pull_request:
    branches:
      - master
  # Déclenchement explicite sur une branche : nécessaire pour les branches
  # poussées par un agent avec GITHUB_TOKEN — GitHub ne déclenche AUCUN
  # workflow sur ces pushes (garde anti-récursion), mais workflow_dispatch
  # est l'exception documentée de cette garde. Même correctif que
  # stage-gates.yml côté blueprint-maker.
  workflow_dispatch:

jobs:
  gate:
    name: npm run gate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modular
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: modular_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run convergence gate
        run: npm run gate

      - name: Package the embedded runtime from the reviewed sources
        run: |
          npm ci --prefix bpm/frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix bpm/frontend
          python -m pip wheel --no-deps . -w "${{ runner.temp }}/modular-wheel"
          python -m pip install --no-deps "${{ runner.temp }}"/modular-wheel/*.whl

      - name: Run all six loading layouts from the installed wheel
        run: |
          python -m pip install playwright==1.56.0
          browser="$(command -v google-chrome)"
          "$browser" --version
          MODULAR_TEST_CHROMIUM="$browser" python scripts/verify-skeleton-wheel.py

      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-modular-wheel
          path: ${{ runner.temp }}/modular-wheel/*.whl

      - name: Exercise Python workers with local SMTP and HTTPS receivers
        run: python -m unittest discover -s tests/python -v

      - name: Install and exercise Monitor with an isolated AI provider
        run: |
          python -m pip install -r deploy/prompteur-api-requirements.txt
          python -m unittest discover -s tests/monitor -v
          npx vitest run tests/monitor-stream.test.ts tests/monitor-session.test.ts tests/wiki-guest.test.ts

      - name: Exercise personal modules on a migrated database
        env:
          DATABASE_URL: postgresql://modular:test_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/modular_test
        run: |
          npx prisma migrate deploy
          MODULAR_TEST_DATABASE_URL="$DATABASE_URL" npx vitest run tests/modules-postgres.test.ts tests/auth-postgres.test.ts

      - name: Compile and render flag shaders (GLSL ES 1.00 / Mesa EGL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
          python -m pip install moderngl==5.12.0 Pillow==12.3.0 numpy==2.5.3
          python scripts/verify-flag-shaders.py
