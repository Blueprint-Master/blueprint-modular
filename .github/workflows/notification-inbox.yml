name: Notification inbox and hydration
on:
  pull_request:
    paths:
      - 'components/NotificationBell.tsx'
      - 'components/usePersonalInbox.ts'
      - 'contexts/NotificationHistoryContext.tsx'
      - 'tests/notification-bell-inbox.test.tsx'
      - 'tests/notification-history-hydration.test.tsx'
      - '.github/workflows/notification-inbox.yml'
permissions:
  contents: read
jobs:
  inbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install vitest run tests/notification-bell-inbox.test.tsx tests/notification-history-hydration.test.tsx
