# Déploiement manuel de Blueprint Modular sur le serveur de prod (bpm-prod).
#
# Calqué sur le manual-deploy.yml de blueprint-maker : MÊME mécanisme de
# connexion, c'est-à-dire AUCUNE connexion distante. Le job s'exécute
# directement sur un runner GitHub self-hosted installé sur bpm-prod
# (`runs-on: [self-hosted, bpm-prod]`). Il n'y a donc :
#   - pas de host / port,
#   - pas d'étape Tailscale,
#   - pas de secrets SSH (SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / SSH_PORT),
#   - pas de step appleboy/ssh-action.
# Le runner EST le serveur : on opère sur le clone présent sur la machine.
#
# Déclenchement : onglet « Actions » → « Manual deploy (bpm-prod) » →
# bouton « Run workflow » (tappable depuis mobile).
#
# Ce workflow ne modifie pas deploy-from-git.sh ni la logique applicative :
# il met le clone du serveur à jour sur origin/master puis lance le script
# de déploiement existant (qui gère vitrine, doc, build Next.js, Prisma
# migrate et le service PM2 « blueprint-app »).

name: Manual deploy (bpm-prod)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Blueprint Modular
    runs-on: [self-hosted, bpm-prod]
    steps:
      - name: Deploy
        run: |
          cd ~/blueprint-modular
          git fetch origin
          git reset --hard origin/master  # reset --hard : prod doit refléter origin/master exactement, jamais avoir de commits locaux (cf. incident 04/06/2026 côté maker)
          chmod +x deploy/deploy-from-git.sh
          ./deploy/deploy-from-git.sh
