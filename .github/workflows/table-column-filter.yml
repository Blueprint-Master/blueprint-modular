name: Qualifier le filtre de colonne du paquet installé
on:
  pull_request:
    branches: [codex/q-table-facets-582f05de]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le ZIP du SHA demandé
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          revision="$HEAD_SHA"
          if [[ "$VARIANT" == baseline ]]; then revision="$BASE"; fi
          git worktree add --detach "$RUNNER_TEMP/source" "$revision"
          python "$RUNNER_TEMP/source/scripts/build-modules-bundle.py" --output "$RUNNER_TEMP/dist"
          zip=("$RUNNER_TEMP"/dist/blueprint-modules-v*.zip)
          test "${#zip[@]}" -eq 1
          unzip -q "${zip[0]}" -d "$RUNNER_TEMP/install"
          test "$(cat "$RUNNER_TEMP/install/application/BUILD-REVISION")" = "$revision"
          sha256sum "${zip[0]}" > "$RUNNER_TEMP/dist/SHA256SUMS"
      - name: Construire le core depuis le ZIP et installer le tarball dans le consommateur
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install/application"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/core --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/core
          (cd packages/core && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dist" --silent)
          tarball=("$RUNNER_TEMP"/dist/blueprint-modular-core-*.tgz)
          test "${#tarball[@]}" -eq 1
          sha256sum "${tarball[0]}" >> "$RUNNER_TEMP/dist/SHA256SUMS"
          mkdir -p packages/core/consumer/node_modules/@blueprint-modular/core
          tar -xzf "${tarball[0]}" -C packages/core/consumer/node_modules/@blueprint-modular/core --strip-components=1
          cp "$GITHUB_WORKSPACE/scripts/table-column-filter-consumer.jsx" packages/core/consumer/
          node_modules/.bin/esbuild packages/core/consumer/table-column-filter-consumer.jsx --bundle --platform=browser --loader:.png=dataurl --loader:.svg=dataurl --loader:.woff2=dataurl --external:react-plotly.js --outfile="$RUNNER_TEMP/consumer.js"
      - name: Vérifier la surface des props sur les sources du ZIP et la synchronisation des catalogues
        if: matrix.revision == 'candidate'
        run: |
          set -euo pipefail
          python3 scripts/gate-docs-sync.py
          gate="$RUNNER_TEMP/install/application/packages/core"
          cp -R packages/core/gate "$gate/"
          cp packages/core/vitest.config.ts "$gate/"
          (cd "$gate" && node_modules/.bin/vitest run gate/props.test.ts)
      - name: Vérifier les interactions, les pieds et le contrôle externe dans Chromium
        env:
          VARIANT: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --quiet 'playwright==1.56.0'
          args=()
          if [[ "$VARIANT" == baseline ]]; then args+=(--baseline); fi
          "$RUNNER_TEMP/qa/bin/python" scripts/verify-table-column-filter.py "$RUNNER_TEMP/consumer.js" --chrome "$(command -v google-chrome)" "${args[@]}" | tee "$RUNNER_TEMP/dist/browser.json"
      - name: Démarrer la préproduction locale au SHA candidat et relire son catalogue
        if: matrix.revision == 'candidate'
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          HOSTNAME: 127.0.0.1
          PORT: 3040
          NEXTAUTH_URL: http://127.0.0.1:3040
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install/application"
          npx --no-install prisma generate
          npm run build -- --webpack
          bash deploy/copy-standalone-assets.sh
          export NEXTAUTH_SECRET="$(openssl rand -hex 32)"
          node .next/standalone/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 \
            "$NEXTAUTH_URL/api/health" -o "$RUNNER_TEMP/dist/health.json"
          jq -e --arg sha "$EXPECTED_REVISION" \
            '.status == "ok" and .sourceCommit == $sha and .applicationVersion == "0.1.61"' \
            "$RUNNER_TEMP/dist/health.json"
          cp "$GITHUB_WORKSPACE/scripts/verify-table-mcp.mjs" "$RUNNER_TEMP/install/application/scripts/"
          node scripts/verify-table-mcp.mjs "$NEXTAUTH_URL" | tee "$RUNNER_TEMP/dist/table-mcp.json"
          python3 - "$GITHUB_WORKSPACE/scripts" <<'PY'
          import os, runpy, sys
          from pathlib import Path
          from urllib.request import urlopen
          scripts = Path(sys.argv[1])
          sys.path.insert(0, str(scripts))
          catalogue = runpy.run_path(str(scripts / "verify-modules-install.py"))["Catalogue"]()
          base = os.environ["NEXTAUTH_URL"]
          with urlopen(base + "/modules", timeout=30) as response:
              catalogue.feed(response.read().decode())
          assert len(catalogue.modules) == 32
          for slug, paths in catalogue.modules.items():
              assert len(paths) == 2 and f"/modules/{slug}/documentation" in paths
              for path in paths:
                  with urlopen(base + path, timeout=30) as response:
                      body = response.read()
                      assert response.status == 200 and response.geturl() == base + path
                      assert b"<!DOCTYPE html>" in body and b"Internal Server Error" not in body
          print("32/32 entries and 32/32 documentation pages on the installed standalone")
          PY
          tar --exclude='.env' --exclude='.env.*' -czf "$RUNNER_TEMP/dist/standalone.tar.gz" BUILD-REVISION package.json .next/standalone
      - uses: actions/upload-artifact@v4
        with:
          name: table-column-filter-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
