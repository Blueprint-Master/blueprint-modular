name: Install the 32 modules from their release archive
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modular
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: modules_test
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: modules_test
          MYSQL_USER: modular
          MYSQL_PASSWORD: import-fixture
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package and extract outside the repository
        run: |
          npm run build:modules-bundle -- --output "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP/release/blueprint-modules-latest.zip" -d "$RUNNER_TEMP/install"
      - name: Install, migrate and exercise the extracted application
        env:
          DATABASE_URL: postgresql://modular:fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/modules_test
          MODULAR_QA_EMAIL: release@example.test
          MODULAR_QA_PASSWORD: isolated-install-fixture
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          cd "$RUNNER_TEMP/install/application"
          npm ci --no-audit --no-fund
          npm ci --prefix packages/core --no-audit --no-fund
          npm run build --prefix packages/core
          npm run build:standalone
          npx --no-install prisma migrate deploy
          node "$GITHUB_WORKSPACE/scripts/seed-module-install-fixture.cjs" "$PWD"
          python3 -m venv "$RUNNER_TEMP/module-browser"
          "$RUNNER_TEMP/module-browser/bin/pip" install playwright==1.56.0 'requests>=2.32,<3'
          export MODULAR_TEST_CHROMIUM="$(command -v google-chrome)"
          "$RUNNER_TEMP/module-browser/bin/python" "$GITHUB_WORKSPACE/scripts/verify-modules-install.py" "$PWD"
      - name: Exercise analysis, reports, dashboards and team workflows across restart
        env:
          MODULAR_TEST_DATABASE_URL: postgresql://modular:fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/modules_test
        run: |
          export MODULAR_TEST_CHROMIUM="$(command -v google-chrome)"
          "$RUNNER_TEMP/module-browser/bin/python" scripts/verify-installed-analysis.py "$RUNNER_TEMP/install/application"
          "$RUNNER_TEMP/module-browser/bin/python" scripts/verify-worker-console.py "$RUNNER_TEMP/install/application"
      - name: Exercise the wheel and inspect the packed npm exports from the installed ZIP
        env:
          MODULAR_IMPORT_PROTOCOLS: '1'
          MODULAR_IMPORT_POSTGRES: postgresql://modular:fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/modules_test
          MODULAR_IMPORT_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MODULAR_IMPORT_MYSQL_PASSWORD: import-fixture
        run: |
          cd "$RUNNER_TEMP/install/application"
          npm ci --prefix bpm/frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix bpm/frontend
          test -x /usr/lib/openssh/sftp-server || { sudo apt-get update -qq && sudo apt-get install -y openssh-sftp-server; }
          python3 -m pip wheel --no-deps . -w "$RUNNER_TEMP/release"
          (cd packages/core && npm pack --pack-destination "$RUNNER_TEMP/release")
          "$RUNNER_TEMP/module-browser/bin/pip" install --no-deps "$RUNNER_TEMP/release/"*.whl
          "$RUNNER_TEMP/module-browser/bin/pip" install 'psycopg[binary]>=3.1,<4' 'pymysql[rsa]>=1.1,<2' 'paramiko>=3,<5'
          "$RUNNER_TEMP/module-browser/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests/python" -v
          python3 "$GITHUB_WORKSPACE/scripts/verify-module-distributions.py" "$RUNNER_TEMP/release/"blueprint-modules-v*.zip "$RUNNER_TEMP/release/"*.whl "$RUNNER_TEMP/release/"*.tgz
      - name: Consume the npm package outside the project
        run: |
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$consumer"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --legacy-peer-deps "$RUNNER_TEMP/release/"*.tgz
          cp scripts/verify-packed-modules.mjs "$consumer/check.mjs"
          node "$consumer/check.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-modules-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/blueprint-modules-v*.zip
            ${{ runner.temp }}/release/*.whl
            ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
