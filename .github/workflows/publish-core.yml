# Publication npm de @blueprint-modular/core (le paquet JS consommé par
# blueprint-maker et les apps générées).
#
# Même mécanisme que manual-deploy.yml : AUCUNE connexion distante — le job
# s'exécute sur le runner self-hosted installé sur bpm-prod (`runs-on:
# [self-hosted, bpm-prod]`), qui EST le serveur.
#
# AUTHENTIFICATION (13/11) : le job supposait npm authentifié sur la machine
# (npm login / ~/.npmrc). Ce n'était plus vrai : les runs 1, 2 (06/08) et 3
# (13/11) ont tous échoué en `E404 Not Found - PUT …@blueprint-modular%2fcore`,
# la réponse de npm à un émetteur non authentifié. Les versions 0.3.10 à 0.3.15
# ont été publiées hors de ce workflow. Le jeton vient désormais du secret
# GitHub `NPM_TOKEN` (jeton granulaire npm, lecture-écriture sur le scope
# @blueprint-modular), écrit dans un .npmrc TEMPORAIRE propre au job et effacé
# en sortie : rien dans le dépôt, rien qui survive au job sur la machine.
# Secret absent : le job le DIT et s'arrête, il ne tente pas une publication
# vouée au 404.
#
# Déclenchement : onglet « Actions » → « Publish core to npm » → « Run
# workflow » (tappable depuis mobile). Publie la version telle qu'elle est
# dans packages/core/package.json ; npm REFUSE de republier une version déjà
# existante — c'est le garde-fou : bumper packages/core/package.json AVANT.
#
# Séquence identique au script local `npm run publish:core`
# (cd packages/core && npm install && npm run build && npm publish).

name: Publish core to npm

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish @blueprint-modular/core
    runs-on: [self-hosted, bpm-prod]
    steps:
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "✖ Secret NPM_TOKEN absent : ajoute-le dans Settings → Secrets and variables → Actions (jeton granulaire npm, lecture-écriture sur @blueprint-modular)."
            exit 1
          fi
          NPMRC="$(mktemp)"
          trap 'rm -f "$NPMRC"' EXIT
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          npm whoami >/dev/null || { echo "✖ Jeton NPM_TOKEN refusé par npm (expiré ou sans droit) : le renouveler."; exit 1; }
          cd ~/blueprint-modular
          git fetch origin
          git reset --hard origin/master  # prod reflète origin/master exactement (cf. manual-deploy)
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          echo "→ Publication de @blueprint-modular/core@${VERSION}"
          if npm view "@blueprint-modular/core@${VERSION}" version >/dev/null 2>&1; then
            echo "✖ La version ${VERSION} est DÉJÀ publiée sur npm — rien à faire."
            echo "  Bumpe packages/core/package.json puis relance ce workflow."
            exit 1
          fi
          npm run publish:core
          echo "✅ @blueprint-modular/core@${VERSION} publié."
