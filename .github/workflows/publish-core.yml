# Publication npm de @blueprint-modular/core (le paquet JS consommé par
# blueprint-maker et les apps générées).
#
# AUTHENTIFICATION : publication de CONFIANCE npm (OIDC), sans aucun jeton.
# GitHub atteste auprès de npm que c'est CE workflow de CE dépôt qui publie ;
# npm n'accepte que l'éditeur de confiance déclaré dans les réglages du paquet
# (npmjs.com → @blueprint-modular/core → Settings → Trusted Publisher →
# GitHub Actions : Blueprint-Master / blueprint-modular / publish-core.yml).
# Rien à stocker, rien à renouveler.
#
# Pourquoi plus le runner de bpm-prod : les trois lancements précédents (06/08 ×2,
# 13/11) ont échoué en `E404 Not Found - PUT …@blueprint-modular%2fcore`, la
# réponse de npm à un émetteur non authentifié — le job supposait un `npm login`
# sur la machine qui n'existait pas, et 0.3.10 à 0.3.15 ont été publiées à la
# main. Et npm n'accepte la publication de confiance que depuis les runners
# HÉBERGÉS par GitHub (documentation npm, 13/11 : « Self-hosted runners are not
# currently supported »). Le job tourne donc sur ubuntu-latest, depuis un
# checkout propre de master.
#
# Déclenchement : onglet « Actions » → « Publish core to npm » → « Run
# workflow », ou par un agent (workflow_dispatch). Publie la version telle
# qu'elle est dans packages/core/package.json ; npm REFUSE de republier une
# version déjà existante — c'est le garde-fou : bumper packages/core/package.json
# AVANT.
#
# Séquence identique au script local `npm run publish:core`
# (cd packages/core && npm install && npm run build && npm publish).

name: Publish core to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC : requis par la publication de confiance npm

jobs:
  publish:
    name: Publish @blueprint-modular/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm assez récent pour la publication de confiance (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Version absente du registre
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          echo "→ Publication de @blueprint-modular/core@${VERSION}"
          if npm view "@blueprint-modular/core@${VERSION}" version >/dev/null 2>&1; then
            echo "✖ La version ${VERSION} est DÉJÀ publiée sur npm — rien à faire."
            echo "  Bumpe packages/core/package.json puis relance ce workflow."
            exit 1
          fi

      # Les composants vivent à la RACINE du dépôt (components/bpm/) : TypeScript y
      # résout `react` depuis le node_modules racine pour émettre leurs .d.ts (#240).
      - name: Dépendances racine
        run: npm ci

      - name: Publication
        run: npm run publish:core

      - name: Vérification sur le registre
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          for i in 1 2 3 4 5 6; do
            if npm view "@blueprint-modular/core@${VERSION}" version >/dev/null 2>&1; then
              echo "✅ @blueprint-modular/core@${VERSION} publié et visible sur le registre."
              exit 0
            fi
            sleep 10
          done
          echo "✖ Publication annoncée mais version introuvable sur le registre après 60 s."
          exit 1
