name: Newsletter publication dates on the installed archive
on:
  pull_request:
    branches: [codex/qualification-modular-4405e6f0]
    paths:
      - 'app/(app)/modules/newsletter/**'
      - 'scripts/verify-newsletter-publication.py'
      - '.github/workflows/newsletter-publication.yml'
permissions:
  contents: read
jobs:
  dates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [false, true]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EXPECTED_SHA: ${{ matrix.candidate && github.event.pull_request.head.sha || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the standalone from the exact archive
        working-directory: source
        run: |
          python3 scripts/build-modules-bundle.py --output "$RUNNER_TEMP/release"
          zip="$RUNNER_TEMP/release/blueprint-modules-latest.zip"
          sha256sum "$zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install/application"
          test "$(cat BUILD-REVISION)" = "$EXPECTED_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/core --ignore-scripts --no-audit --no-fund
          npx --no-install prisma generate
          npm run build --prefix packages/core
          npm run build:standalone
      - name: Compare absent and supplied dates in Chromium
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install playwright==1.56.0
          origin=http://127.0.0.1:3891
          export HOSTNAME=127.0.0.1 PORT=3891 NEXTAUTH_URL="$origin"
          NEXTAUTH_SECRET=$(openssl rand -hex 32)
          export NEXTAUTH_SECRET
          (cd "$RUNNER_TEMP/install/application" && exec node .next/standalone/server.js) >"$RUNNER_TEMP/standalone.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS "$origin/modules/newsletter" >/dev/null; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          cmd=("$RUNNER_TEMP/browser/bin/python" scripts/verify-newsletter-publication.py "$origin" "$(command -v google-chrome)")
          if [[ "$CANDIDATE" == "false" ]]; then
            if "${cmd[@]}" >"$RUNNER_TEMP/red.log" 2>&1; then exit 1; fi
            grep -F "AssertionError: 01/11/2026" "$RUNNER_TEMP/red.log"
            "${cmd[@]}" --baseline
          else
            "${cmd[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.candidate
        with:
          name: newsletter-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/release/blueprint-modules-v*.zip
          if-no-files-found: error
