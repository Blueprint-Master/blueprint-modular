# vhost nginx pour status.blueprint-modular.com
# À placer dans /etc/nginx/sites-available/status.blueprint-modular.com puis :
#   sudo ln -s /etc/nginx/sites-available/status.blueprint-modular.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo certbot --nginx -d status.blueprint-modular.com
#   sudo systemctl reload nginx
#
# Prérequis DNS : status.blueprint-modular.com → bpm-prod (51.83.88.18).
# L'app Next.js (PM2 « blueprint-app ») sert /status sur localhost:3000.

server {
    listen 80;
    server_name status.blueprint-modular.com;
    client_max_body_size 5m;

    # Racine du sous-domaine → page de statut.
    location = / {
        return 302 /status;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
