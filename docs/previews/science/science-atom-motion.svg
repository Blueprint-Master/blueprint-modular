<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Preuve animée de densité électronique locale" viewBox="0 0 520 520">
<defs>
 <radialGradient id="field"><stop stop-color="#73e4a7" stop-opacity=".48"/><stop offset=".45" stop-color="#73e4a7" stop-opacity=".12"/><stop offset="1" stop-color="#73e4a7" stop-opacity="0"/></radialGradient>
 <radialGradient id="lobe"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".22" stop-color="#73e4a7" stop-opacity=".62"/><stop offset="1" stop-color="#73e4a7" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter><filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="520" height="520" rx="32" fill="#07111f"/>
<text x="36" y="54" fill="#9bb0c2" font-size="10" letter-spacing="2">DENSITÉ ÉLECTRONIQUE · BOUCLE 12 S</text>
<text x="36" y="102" fill="#f6fbff" font-size="40" font-weight="700">C</text><text x="102" y="82" fill="#f6fbff" font-size="16" font-weight="600">Carbone</text><text x="102" y="104" fill="#9bb0c2" font-size="11">Z = 6</text>
<ellipse cx="260" cy="252" rx="185" ry="78" transform="rotate(-28 260 252)" fill="url(#field)" filter="url(#blur)"/>
<ellipse cx="260" cy="252" rx="170" ry="63" transform="rotate(61 260 252)" fill="url(#field)" filter="url(#blur)" opacity=".72"/>
<g fill="none" stroke="#73e4a7"><ellipse cx="260" cy="252" rx="172" ry="66" transform="rotate(-28 260 252)" stroke-width="1.5" stroke-dasharray="3 10"/><ellipse cx="260" cy="252" rx="152" ry="54" transform="rotate(61 260 252)" stroke-opacity=".7"/></g>
<g data-science-density-lobes="4">
 <ellipse class="lobe l1" cx="174" cy="207" rx="62" ry="27" transform="rotate(-26 174 207)" fill="url(#lobe)" filter="url(#soft)"/>
 <ellipse class="lobe l2" cx="338" cy="296" rx="66" ry="29" transform="rotate(-25 338 296)" fill="url(#lobe)" filter="url(#soft)"/>
 <ellipse class="lobe l3" cx="306" cy="168" rx="58" ry="25" transform="rotate(61 306 168)" fill="url(#lobe)" filter="url(#soft)"/>
 <ellipse class="lobe l4" cx="213" cy="337" rx="61" ry="26" transform="rotate(61 213 337)" fill="url(#lobe)" filter="url(#soft)"/>
</g>
<circle cx="260" cy="252" r="34" fill="#07111f" fill-opacity=".7" stroke="#73e4a7" stroke-width="1.5"/>
<circle cx="267" cy="252" r="5.2" fill="#eef6ff"/><circle cx="250" cy="261" r="4.2" fill="#73e4a7"/><circle cx="261" cy="236" r="4.2" fill="#eef6ff"/><circle cx="271" cy="266" r="5.2" fill="#73e4a7"/><circle cx="241" cy="249" r="4.2" fill="#eef6ff"/><circle cx="278" cy="241" r="4.2" fill="#73e4a7"/>
<g transform="translate(36 424)"><rect width="448" height="62" rx="14" fill="#73e4a7" fill-opacity=".12" stroke="#294052"/><text x="18" y="24" fill="#9bb0c2" font-size="10">PHÉNOMÈNE</text><text x="18" y="45" fill="#f6fbff" font-size="13">apparition · concentration · dissipation</text></g>
<style>
.lobe{transform-box:fill-box;transform-origin:center;animation:science-density-bloom 12s cubic-bezier(.45,0,.25,1) infinite}.l2{animation-delay:-4s}.l3{animation-delay:-8s}.l4{animation-delay:-2s}
@keyframes science-density-bloom{0%,100%{opacity:.08;transform:scale(.45)}18%{opacity:.35;transform:scale(.72)}42%{opacity:.92;transform:scale(1.08)}64%{opacity:.48;transform:scale(.9)}82%{opacity:.12;transform:scale(.58)}}
@media(prefers-reduced-motion:reduce){.lobe{animation:none}}
</style></svg>
