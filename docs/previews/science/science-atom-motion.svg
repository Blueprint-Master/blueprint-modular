<svg role="img" aria-label="Analyseur atomique : Ruthénium" viewBox="0 0 520 520" style="display:block;width:100%;height:100%;color:#e8f2fa;font-family:ui-sans-serif,system-ui,sans-serif"><title>Ruthénium</title><desc>Configuration de référence de l’atome neutre et coupe d’une orbitale hydrogénoïde m=0. Ce modèle à un électron n’est pas la densité totale de l’élément. Les couleurs indiquent le signe de la fonction d’onde, pas des charges. Aucun isotope n’est implicite.</desc><rect width="520" height="520" rx="28" fill="#0a1321"></rect><g fill="#e8f2fa"><text x="32" y="34" fill="#99aec1" font-size="9" letter-spacing="2">EXPLORER LA STRUCTURE ÉLECTRONIQUE</text><text x="30" y="102" font-size="62" font-weight="650">Ru</text><text x="154" y="72" font-size="21" font-weight="600">Ruthénium</text><text x="154" y="96" font-size="12" fill="#99aec1">Z = 44 · atome neutre</text><text x="488" y="73" text-anchor="end" font-size="11" fill="#99aec1">bloc d</text></g><g><path d="M32 122H488" stroke="#99aec1" stroke-opacity=".25"></path><text x="32" y="141" font-size="9" letter-spacing="1" fill="#99aec1">CONFIGURATION DE RÉFÉRENCE</text><text x="32" y="165" fill="#e8f2fa" font-size="17" font-family="ui-monospace,monospace">[Kr] 4d⁷ 5s¹</text></g><g fill="#99aec1"><text x="32" y="215" font-size="9" letter-spacing="1">COUCHES</text><g transform="translate(32 238)"><text font-size="10">n=1</text><rect x="32" y="-8" width="4" height="7" rx="3" fill="#67ddeb" fill-opacity="0.35"></rect><text x="102" font-size="11" fill="#e8f2fa">2 e⁻</text></g><g transform="translate(32 260)"><text font-size="10">n=2</text><rect x="32" y="-8" width="14.4" height="7" rx="3" fill="#67ddeb" fill-opacity="0.35"></rect><text x="102" font-size="11" fill="#e8f2fa">8 e⁻</text></g><g transform="translate(32 282)"><text font-size="10">n=3</text><rect x="32" y="-8" width="32.4" height="7" rx="3" fill="#67ddeb" fill-opacity="0.35"></rect><text x="102" font-size="11" fill="#e8f2fa">18 e⁻</text></g><g transform="trans