<svg role="img" aria-label="Analyseur atomique : Oxygène" viewBox="0 0 520 520" style="display:block;width:100%;height:100%;color:#182f43;font-family:ui-sans-serif,system-ui,sans-serif"><title>Oxygène</title><desc>Configuration de référence de l’atome neutre et coupe d’une orbitale hydrogénoïde m=0. Ce modèle à un électron n’est pas la densité totale de l’élément. Les couleurs indiquent le signe de la fonction d’onde, pas des charges. Aucun isotope n’est implicite.</desc><rect width="520" height="520" rx="28" fill="#f6f3ed"></rect><g fill="#182f43"><text x="32" y="34" fill="#516776" font-size="9" letter-spacing="2">EXPLORER LA STRUCTURE ÉLECTRONIQUE</text><text x="30" y="102" font-size="62" font-weight="650">O</text><text x="154" y="72" font-size="21" font-weight="600">Oxygène</text><text x="154" y="96" font-size="12" fill="#516776">Z = 8 · atome neutre</text><text x="488" y="73" text-anchor="end" font-size="11" fill="#516776">bloc p</text></g><g><path d="M32 122H488" stroke="#516776" stroke-opacity=".25"></path><text x="32" y="141" font-size="9" letter-spacing="1" fill="#516776">CONFIGURATION DE RÉFÉRENCE</text><text x="32" y="165" fill="#182f43" font-size="17" font-family="ui-monospace,monospace">1s² 2s² 2p⁴</text></g><g fill="#516776"><text x="32" y="215" font-size="9" letter-spacing="1">COUCHES</text><g transform="translate(32 238)"><text font-size="10">n=1</text><rect x="32" y="-8" width="4" height="7" rx="3" fill="#006e91" fill-opacity="0.35"></rect><text x="102" font-size="11" fill="#182f43">2 e⁻</text></g><g transform="translate(32 260)"><text font-size="10">n=2</text><rect x="32" y="-8" width="10.8" height="7" rx="3" fill="#006e91" fill-opacity="1"></rect><text x="102" font-size="11" fill="#182f43">6 e⁻</text></g></g><g transform="translate(324 281) scale(.68)"><g data-science-layer="atomic-orbital" data-scientific-status="hydrogenic-basis-not-total-density" opacity="1"><g stroke="currentColor" stroke-opacity=".18" fill="none"><path d="M-170 0H170M0-155V155